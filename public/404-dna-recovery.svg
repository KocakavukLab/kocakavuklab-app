    <path d="M48 334C168 198 278 493 480 318" fill="none" stroke="url(#orange)" stroke-width="38" stroke-linecap="round"/>
    <path d="M48 500C170 640 278 348 480 502" fill="none" stroke="url(#ink)" stroke-width="38" stroke-linecap="round"/>
    <path d="M720 318C920 492 1034 196 1152 334" fill="none" stroke="url(#orange)" stroke-width="38" stroke-linecap="round"/>
    <path d="M720 502C920 348 1032 640 1152 500" fill="none" stroke="url(#ink)" stroke-width="38" stroke-linecap="round"/>
  </g>

  <g stroke="url(#rung)" stroke-width="15" stroke-linecap="round">
