<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Interrupted DNA sequence</title>
  <desc id="description">Two broken DNA strands reconnect through a dotted genomic route surrounded by cell and molecular forms.</desc>
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF914D"/>
      <stop offset="1" stop-color="#E0742E"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34383F"/>
      <stop offset="1" stop-color="#14181F"/>
    </linearGradient>
    <linearGradient id="rung" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF914D"/>
      <stop offset="0.49" stop-color="#FAFAF9"/>
      <stop offset="0.51" stop-color="#FAFAF9"/>
      <stop offset="1" stop-color="#6F83F7"/>
    </linearGradient>
    <radialGradient id="cell" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#FAFAF9"/>
      <stop offset="1" stop-color="#DDE3FF"/>
    </radialGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#14181F" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g opacity="0.34" fill="none" stroke="#737373" stroke-width="2">
