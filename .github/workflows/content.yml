name: Content and build
on:
  pull_request:
  push:
    branches: [psgundla-layout, main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:generate
      - run: npm run content:test
      - run: npm test -- --watchAll=false
      - name: Build existing site
        run: npm run build
